plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.vpn'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.vpn"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1'
            ]
        }
        // ⭐ แก้ปัญหา .so ซ้ำ
        jniLibs {
            pickFirsts += [
                'lib/arm64-v8a/libhev-socks5-tunnel.so',
                'lib/armeabi-v7a/libhev-socks5-tunnel.so',
                'lib/x86/libhev-socks5-tunnel.so',
                'lib/x86_64/libhev-socks5-tunnel.so'
            ]
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.15.0'
        force 'androidx.core:core-ktx:1.15.0'
    }
}

dependencies {
    // ===== AndroidX พื้นฐาน =====
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // ===== Navigation =====
    implementation 'androidx.navigation:navigation-fragment:2.8.0'
    implementation 'androidx.navigation:navigation-ui:2.8.0'

    // ===== Lifecycle =====
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.4'

    // ===== Room Database =====
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // ===== DataStore =====
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // ===== Gson =====
    implementation 'com.google.code.gson:gson:2.11.0'

    // ===== SSH (JSch) =====
    implementation 'com.github.mwiede:jsch:0.2.17'

    // ===== Network / HTTP =====
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // ❌ ลบ hevtunnel — เพราะ workflow คอมไพล์ .so เอง
    // implementation 'com.zaneschepke:hevtunnel:1.0.1'

    // ===== ViewPager2 + Fragment =====
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment:1.6.2'

    // ===== MPAndroidChart =====
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ===== ZXing — QR Code =====
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // ===== Kotlin runtime (จำเป็นสำหรับ Xray) =====
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'

    // ⭐ Xray Core (V2Ray) — ใช้ AAR ที่ workflow ดาวน์โหลด
    implementation files('libs/libv2ray.aar')

    // ===== Testing =====
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
