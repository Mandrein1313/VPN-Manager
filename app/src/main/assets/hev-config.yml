tunnel:
  mtu: 1280
  ipv4: 10.0.0.2
  ipv6: '::'

socks5:
  port: 1080
  address: 127.0.0.1
  udp: 'tcp'

misc:
  log-file: stderr
  log-level: warn
  task-stack-size: 65536
  connect-timeout: 15000
  # ⭐ เพิ่มเป็น 5 นาที — ลดการตัด connection ตอน idle (เดิม 120000 = 2 นาที)
  read-write-timeout: 300000
  tcp-buffer-size: 131072
  udp-recv-buffer-size: 65536
  limit-nofile: 65535
