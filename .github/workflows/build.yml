name: Android Cloud Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK + NDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653'
        accept-android-sdk-licenses: true
        log-accepted-android-sdk-licenses: true

    # ⭐ คอมไพล์ hev-socks5-tunnel .so เองด้วย NDK
    - name: Build hev-socks5-tunnel .so
      run: |
        set -e
        
        echo "===== Cloning hev-socks5-tunnel ====="
        git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel.git
        
        cd hev-socks5-tunnel
        
        echo "===== Repository structure ====="
        ls -la
        echo "--- jni/ ---"
        ls -la jni/ 2>/dev/null || echo "no jni folder"
        echo "--- src/ ---"
        ls -la src/ 2>/dev/null || echo "no src folder"
        
        echo "===== Creating Android.mk ====="
        mkdir -p jni
        cat > jni/Android.mk << 'EOF'
        LOCAL_PATH := $(call my-dir)
        include $(call all-subdir-makefiles)
        EOF
        
        if [ ! -d "jni/hev-socks5-tunnel" ]; then
          ln -sf "$(pwd)" jni/hev-socks5-tunnel
        fi
        
        echo "===== Running ndk-build ====="
        export NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
        
        $NDK_HOME/ndk-build \
          NDK_PROJECT_PATH=. \
          APP_BUILD_SCRIPT=jni/Android.mk \
          "APP_ABI=arm64-v8a armeabi-v7a x86 x86_64" \
          "APP_PLATFORM=android-24" \
          "APP_CFLAGS=-O3 -DPKGNAME=hev/htproxy -DCLSNAME=TProxyService" \
          V=1 2>&1 | tail -50
        
        echo "===== Built .so files ====="
        find . -name "*.so" -exec ls -lh {} \;
        
        mkdir -p ../app/src/main/jniLibs/arm64-v8a
        mkdir -p ../app/src/main/jniLibs/armeabi-v7a
        mkdir -p ../app/src/main/jniLibs/x86
        mkdir -p ../app/src/main/jniLibs/x86_64
        
        for abi in arm64-v8a armeabi-v7a x86 x86_64; do
          if [ -f "libs/$abi/libhev-socks5-tunnel.so" ]; then
            cp "libs/$abi/libhev-socks5-tunnel.so" "../app/src/main/jniLibs/$abi/"
            echo "✅ Copied $abi"
          fi
        done
        
        echo "===== Files in jniLibs/ ====="
        find ../app/src/main/jniLibs -name "*.so" -exec ls -lh {} \;

    # ⭐ ดาวน์โหลด AndroidLibXrayLite AAR
    - name: Download AndroidLibXrayLite AAR
      run: |
        set -e
        
        mkdir -p app/libs
        
        # ลอง version ตามลำดับ
        VERSIONS=("1.250608" "1.250504" "1.250401" "1.240910" "1.240609")
        DOWNLOADED=0
        
        for VERSION in "${VERSIONS[@]}"; do
          echo "===== Trying version $VERSION ====="
          
          URLS=(
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/$VERSION/AndroidLibXrayLite-$VERSION.aar"
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/$VERSION/libv2ray-$VERSION.aar"
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/$VERSION/AndroidLibXrayLite.aar"
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/$VERSION/libv2ray.aar"
          )
          
          for URL in "${URLS[@]}"; do
            echo "Trying: $URL"
            if curl -fSL -o app/libs/AndroidLibXrayLite.aar "$URL" 2>/dev/null; then
              SIZE=$(stat -c%s app/libs/AndroidLibXrayLite.aar 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 100000 ]; then
                echo "✅ Downloaded version $VERSION ($SIZE bytes)"
                DOWNLOADED=1
                break 2
              fi
            fi
          done
        done
        
        if [ $DOWNLOADED -eq 0 ]; then
          echo "❌ Could not download AAR from any version"
          echo "=== Latest release info ==="
          curl -sL "https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest" | grep -E '"tag_name"|"browser_download_url"' | head -20
          exit 1
        fi
        
        echo "===== Files in app/libs/ ====="
        ls -lh app/libs/
        
        echo "===== AAR structure ====="
        unzip -l app/libs/AndroidLibXrayLite.aar 2>/dev/null | head -30 || echo "Not a valid AAR"

    - name: Setup Gradle 8.13
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'

    - name: Clean & Build Debug APK
      run: gradle clean assembleDebug --no-daemon --build-cache --stacktrace

    - name: Generate Timestamp
      id: timestamp
      run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    - name: Upload APK to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "build-${{ steps.timestamp.outputs.timestamp }}"
        name: "Build ${{ steps.timestamp.outputs.timestamp }}"
        draft: false
        prerelease: false
        make_latest: true
        overwrite_files: true
        files: "**/build/outputs/apk/**/*.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}