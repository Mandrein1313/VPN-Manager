name: Android Cloud Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK + NDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653'
        accept-android-sdk-licenses: true
        log-accepted-android-sdk-licenses: true

    # ⭐ คอมไพล์ hev-socks5-tunnel .so เองด้วย NDK
    - name: Build hev-socks5-tunnel .so
      run: |
        set -e
        
        echo "===== Cloning hev-socks5-tunnel ====="
        git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel.git
        
        cd hev-socks5-tunnel
        
        echo "===== Creating Android.mk ====="
        mkdir -p jni
        cat > jni/Android.mk << 'EOF'
        LOCAL_PATH := $(call my-dir)
        include $(call all-subdir-makefiles)
        EOF
        
        if [ ! -d "jni/hev-socks5-tunnel" ]; then
          ln -sf "$(pwd)" jni/hev-socks5-tunnel
        fi
        
        echo "===== Running ndk-build ====="
        export NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
        
        $NDK_HOME/ndk-build \
          NDK_PROJECT_PATH=. \
          APP_BUILD_SCRIPT=jni/Android.mk \
          "APP_ABI=arm64-v8a armeabi-v7a x86 x86_64" \
          "APP_PLATFORM=android-24" \
          "APP_CFLAGS=-O3 -DPKGNAME=hev/htproxy -DCLSNAME=TProxyService" \
          V=1 2>&1 | tail -50
        
        mkdir -p ../app/src/main/jniLibs/arm64-v8a
        mkdir -p ../app/src/main/jniLibs/armeabi-v7a
        mkdir -p ../app/src/main/jniLibs/x86
        mkdir -p ../app/src/main/jniLibs/x86_64
        
        for abi in arm64-v8a armeabi-v7a x86 x86_64; do
          if [ -f "libs/$abi/libhev-socks5-tunnel.so" ]; then
            cp "libs/$abi/libhev-socks5-tunnel.so" "../app/src/main/jniLibs/$abi/"
            echo "✅ Copied $abi"
          fi
        done
        
        find ../app/src/main/jniLibs -name "*.so" -exec ls -lh {} \;

    # ⭐ ดาวน์โหลด AndroidLibXrayLite AAR (libv2ray.aar)
    # แก้: API rate-limit / parse พลาด → ใช้ python + fallback URL ตรง
    - name: Download AndroidLibXrayLite AAR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        mkdir -p app/libs

        FALLBACK_URL="https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.9/libv2ray.aar"

        echo "===== Getting latest release ====="
        AUTH_HDR=()
        if [ -n "$GH_TOKEN" ]; then
          AUTH_HDR=(-H "Authorization: Bearer $GH_TOKEN")
        fi
        LATEST_JSON=$(curl -sL "${AUTH_HDR[@]}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest" || true)

        AAR_URL=$(printf '%s' "$LATEST_JSON" | python3 -c '
import json, sys
try:
    d = json.load(sys.stdin)
    print("Latest tag:", d.get("tag_name", ""), file=sys.stderr)
    for a in d.get("assets") or []:
        name = (a.get("name") or "")
        if name == "libv2ray.aar":
            print(a.get("browser_download_url", ""))
            break
except Exception as e:
    print("API parse failed:", e, file=sys.stderr)
' || true)

        if [ -z "$AAR_URL" ]; then
          echo "API ไม่พบ libv2ray.aar — ใช้ fallback"
          AAR_URL="$FALLBACK_URL"
        fi

        echo "AAR URL: $AAR_URL"
        echo "===== Downloading ====="
        curl -fSL -o app/libs/libv2ray.aar "$AAR_URL"

        SIZE=$(stat -c%s app/libs/libv2ray.aar)
        if [ "$SIZE" -lt 10000 ]; then
          echo "ไฟล์เล็กเกินไป ($SIZE bytes) ลอง fallback อีกครั้ง"
          curl -fSL -o app/libs/libv2ray.aar "$FALLBACK_URL"
          SIZE=$(stat -c%s app/libs/libv2ray.aar)
        fi
        if [ "$SIZE" -lt 10000 ]; then
          echo "Cannot download libv2ray.aar"
          exit 1
        fi

        echo "Downloaded libv2ray.aar ($SIZE bytes)"
        ls -lh app/libs/
        unzip -l app/libs/libv2ray.aar | head -30

    - name: Setup Gradle 8.13
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'

    - name: Clean & Build Debug APK
      run: gradle clean assembleDebug --no-daemon --build-cache --stacktrace

    - name: Generate Timestamp
      id: timestamp
      run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    - name: Upload APK to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "build-${{ steps.timestamp.outputs.timestamp }}"
        name: "Build ${{ steps.timestamp.outputs.timestamp }}"
        draft: false
        prerelease: false
        make_latest: true
        overwrite_files: true
        files: "**/build/outputs/apk/**/*.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}