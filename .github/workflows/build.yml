name: Android Cloud Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true
        log-accepted-android-sdk-licenses: true

    # ⭐ ดาวน์โหลด v2rayNG APK + extract .so
    - name: Download v2rayNG and Extract .so files
      run: |
        # ดาวน์โหลด APK ล่าสุดจาก GitHub Release
        echo "Downloading v2rayNG APK..."
        curl -L -o v2rayNG.apk \
          "https://github.com/2dust/v2rayNG/releases/download/1.9.16/v2rayNG_1.9.16_arm64-v8a.apk" \
          || curl -L -o v2rayNG.apk \
          "https://github.com/2dust/v2rayNG/releases/latest/download/v2rayNG_1.9.16_arm64-v8a.apk"
        
        # ตรวจว่าโหลดสำเร็จ
        ls -lh v2rayNG.apk
        
        # สร้างโฟลเดอร์ jniLibs
        mkdir -p app/src/main/jniLibs/arm64-v8a
        mkdir -p app/src/main/jniLibs/armeabi-v7a
        mkdir -p app/src/main/jniLibs/x86
        mkdir -p app/src/main/jniLibs/x86_64
        
        # Extract APK
        unzip -o v2rayNG.apk -d v2rayNG_extracted
        
        # ตรวจสอบว่ามี lib ไหม
        echo "=== Files in lib/ ==="
        find v2rayNG_extracted/lib -name "*.so" | head -20 || echo "No .so found!"
        
        # Copy libhev-socks5-tunnel.so ถ้ามี
        [ -f v2rayNG_extracted/lib/arm64-v8a/libhev-socks5-tunnel.so ] && \
          cp v2rayNG_extracted/lib/arm64-v8a/libhev-socks5-tunnel.so app/src/main/jniLibs/arm64-v8a/ || \
          echo "arm64-v8a: not found"
        
        [ -f v2rayNG_extracted/lib/armeabi-v7a/libhev-socks5-tunnel.so ] && \
          cp v2rayNG_extracted/lib/armeabi-v7a/libhev-socks5-tunnel.so app/src/main/jniLibs/armeabi-v7a/ || \
          echo "armeabi-v7a: not found"
        
        [ -f v2rayNG_extracted/lib/x86/libhev-socks5-tunnel.so ] && \
          cp v2rayNG_extracted/lib/x86/libhev-socks5-tunnel.so app/src/main/jniLibs/x86/ || \
          echo "x86: not found"
        
        [ -f v2rayNG_extracted/lib/x86_64/libhev-socks5-tunnel.so ] && \
          cp v2rayNG_extracted/lib/x86_64/libhev-socks5-tunnel.so app/src/main/jniLibs/x86_64/ || \
          echo "x86_64: not found"
        
        # ตรวจสอบปลายทาง
        echo "=== Files in jniLibs/ ==="
        find app/src/main/jniLibs -name "*.so"

    - name: Setup Gradle 8.13
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'

    - name: Clean & Build Debug APK
      run: gradle clean assembleDebug --no-daemon --build-cache --stacktrace

    - name: Generate Timestamp
      id: timestamp
      run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    - name: Upload APK to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "build-${{ steps.timestamp.outputs.timestamp }}"
        name: "Build ${{ steps.timestamp.outputs.timestamp }}"
        draft: false
        prerelease: false
        make_latest: true
        overwrite_files: true
        files: "**/build/outputs/apk/**/*.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}